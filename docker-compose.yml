services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cs_registry
      CS_REGISTRY_APP_PASSWORD: ${CS_REGISTRY_APP_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cs_registry"]
      interval: 5s
      timeout: 5s
      retries: 10
